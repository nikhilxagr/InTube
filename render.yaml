services:
  - type: web
    name: intube-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix server && (mkdir -p server/bin && curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o server/bin/yt-dlp && chmod +x server/bin/yt-dlp || true)
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: 100
      - key: MAX_PROCESSING_TIME_MS
        value: 120000
      - key: MAX_TEMP_STORAGE_MB
        value: 512
      - key: MAX_CONCURRENT_JOBS
        value: 5
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: DOWNLOAD_RATE_LIMIT_MAX
        value: 20
      - key: TEMP_DIR
        value: /tmp/intube
      - key: LOG_LEVEL
        value: info
